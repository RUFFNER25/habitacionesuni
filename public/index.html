<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitaciones para Estudiantes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏠 Habitaciones para Estudiantes Universitarios</h1>
    </header>

    <main>
        <div id="loading" class="loading">Cargando habitaciones...</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="habitaciones-container" class="habitaciones-container">
            <!-- Las habitaciones se cargarán aquí dinámicamente -->
        </div>

        <!-- Modal para detalles -->
        <div id="modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Sistema de Alquiler de Habitaciones</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
