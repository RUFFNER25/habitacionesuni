services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: habitaciones-backend
    ports:
      - "3000:3000"
    volumes:
      - ./habitaciones.db:/app/habitaciones.db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: habitaciones-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
